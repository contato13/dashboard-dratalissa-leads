    <div class="filters" id="filters">

        <label for="dateTo">até</label>
        <input type="date" id="dateTo">
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <section>
      <h2>Comparativo por criativo</h2>
      <p class="section-note" id="rankNote"></p>
      <div id="ranking"></div>
    </section>

    <section>
      <h2>Evolução diária</h2>
      <p class="section-note" id="chartNote"></p>
      <div class="chart-box"><canvas id="dailyChart"></canvas></div>
    </section>

    <section>
      <h2>Detalhamento por criativo</h2>
      <p class="section-note">Resultado consolidado de cada anúncio no período selecionado. Toque no título de uma coluna para ordenar.</p>

        <table id="dataTable">
          <thead><tr id="theadRow"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <footer>
    <span>Fonte: <a id="sourceLink" href="#" target="_blank" rel="noopener"></a>, lida ao vivo.</span>
    <button class="refresh" id="refreshBtn">Atualizar agora</button>
  </footer>

</div>

/* Estado por visão */
const S = {};
for(const k in VIEWS) S[k] = {
  rows: [], linkMap: {}, loaded: false, loading: true,
  dateFrom: null, dateTo: null, campaign: '',
  sortKey: 'resultado', sortDir: 'desc',
  status: {live:false, text:'Carregando dados…'}
};
let viewKey = location.hash.replace('#','');
if(!VIEWS[viewKey]) viewKey = 'leads';
let chart = null;

const V = () => VIEWS[viewKey];
const st = () => S[viewKey];

/* ===================== Utilidades ===================== */
const norm = s => String(s ?? '').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[\u2026]/g,'...').replace(/[\u201c\u201d]/g,'"').replace(/\s+/g,' ').trim();

const fmtBRL = v => v == null ? '—' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtNum = v => v == null ? '—' : v.toLocaleString('pt-BR');
const fmtPct = v => v == null ? '—' : v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';
const fmtPct2 = v => v == null ? '—' : v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%';
const fmtDayShort = iso => { const p = iso.split('-'); return p[2] + '/' + p[1]; };
const toISO = dt => dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== Leitura da planilha (gviz) ===================== */
function gvizUrl(sheetId, params){
  /* Montado à mão: URLSearchParams codifica espaço como "+", e o gviz precisa
     de %20 para achar abas como "LINK DOS POSTS". */
  const p = Object.assign({tqx:'out:json', headers:'1'}, params, {_:Date.now()});
  const q = Object.keys(p).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(p[k])).join('&');
  return 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?' + q;
}

async function fetchGviz(sheetId, params){
  const res = await fetch(gvizUrl(sheetId, params));
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const json = JSON.parse(text.substring(text.indexOf('(')+1, text.lastIndexOf(')')));
  if(json.status === 'error') throw new Error('gviz error');
  return json.table;
}

function cellDate(cell){
  if(!cell || cell.v == null) return null;
  const v = cell.v;
  if(typeof v === 'string'){
    let m = v.match(/Date\((\d+),(\d+),(\d+)/);
    if(m) return new Date(+m[1], +m[2], +m[3]);
    m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);           // dd/mm/aaaa
    if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  }
  if(cell.f){
    const m = String(cell.f).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  }
  return null;
}

function cellNum(cell){
  if(!cell || cell.v == null) return null;
  let v = cell.v;
  if(typeof v === 'number') return v;
  if(typeof v === 'string'){
    v = v.trim().replace(/[R$\s%]/g,'');
    if(!v || v === '-' || v === '\u2014') return null;
    if(v.indexOf(',') > -1) v = v.replace(/\./g,'').replace(',','.');
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  }
  return null;
}

function cellStr(cell){ return cell && cell.v != null ? String(cell.v).trim() : ''; }

/* Mapeia colunas por palavra-chave. Primeira ocorrência vence, para tolerar
   cabeçalhos repetidos, e "custo por X" nunca é confundido com a métrica X. */
function mapColumns(labels){
  const idx = {};
  const set = (k,i) => { if(idx[k] === undefined) idx[k] = i; };
  labels.forEach((l,i) => {
    if(!l) return;
    if(l.indexOf('data') === 0) set('data',i);
    else if(l.indexOf('campanha') > -1) set('campanha',i);
    else if(l.indexOf('conjunto') > -1) set('conjunto',i);
    else if(l.indexOf('anuncio') > -1) set('anuncio',i);
    else if(l.indexOf('invest') > -1 || l.indexOf('valor') > -1) set('investido',i);
    else if(l.indexOf('impress') > -1) set('impressoes',i);
    else if(l.indexOf('custo') > -1){
      if(l.indexOf('clique') > -1) set('cpc',i);
      else if(l.indexOf('visita') > -1) set('cpv',i);
      else if(l.indexOf('seguidor') > -1 || l.indexOf('resultado') > -1 || l.indexOf('lead') > -1) set('custo',i);
    }
    else if(l.indexOf('clique') > -1) set('cliques',i);
    else if(l.indexOf('ctr') > -1) set('ctr',i);
    else if(l.indexOf('visita') > -1) set('visitas',i);
    else if(l.indexOf('seguidor') > -1) set('resultado',i);
    else if(l.indexOf('resultado') > -1 || l.indexOf('lead') > -1) set('resultado',i);
  });
  return idx;
}

function parseResultados(tb){
  let labels = (tb.cols || []).map(c => norm(c.label || ''));
  let dataRows = tb.rows || [];
  // cabeçalho pode vir como primeira linha de dados
  if(!labels.some(l => l.indexOf('anuncio') > -1) && dataRows.length){
    labels = (dataRows[0].c || []).map(c => norm(c ? c.v : ''));
    dataRows = dataRows.slice(1);
  }
  const idx = mapColumns(labels);
  const num = (c,i) => i === undefined ? null : cellNum(c[i]);
  const out = [];
  for(const r of dataRows){
    const c = r.c || [];
    const d = cellDate(c[idx.data]);
    const anuncio = idx.anuncio === undefined ? '' : cellStr(c[idx.anuncio]);
    if(!d || !anuncio) continue;
    out.push({
      data: toISO(d),
      campanha: idx.campanha === undefined ? '' : cellStr(c[idx.campanha]),
      conjunto: idx.conjunto === undefined ? '' : cellStr(c[idx.conjunto]),
      anuncio: anuncio,
      investido: num(c, idx.investido) || 0,
      impressoes: num(c, idx.impressoes),
      visitas: num(c, idx.visitas),
      cliques: num(c, idx.cliques),
      resultado: num(c, idx.resultado) || 0
    });
  }
  return out;
}

function parseLinks(tb){
  const map = {};
  for(const r of (tb.rows || [])){
    const cells = (r.c || []).map(cellStr);
    const nome = cells[0];
    const url = cells.find(v => /^https?:\/\//i.test(v));
    if(nome && url && !/^https?:\/\//i.test(nome)) map[norm(nome)] = url;
  }
  return map;
}

function linksLocais(mapa){
  const out = {};
  for(const nome in mapa) out[norm(nome)] = IG(mapa[nome]);
  return out;
}

/* Cópia local como base; cada aba "LINK DOS POSTS" encontrada sobrescreve. */
async function carregarLinks(view){
  const mapa = linksLocais(view.fallbackLinks);
  for(const fonte of LINKS_COMPARTILHADOS){
    try{ Object.assign(mapa, parseLinks(await fetchGviz(fonte.sheetId, {sheet: fonte.sheet}))); }
    catch(e){ /* aba inexistente nessa planilha: segue para a próxima */ }
  }
  return mapa;
}

async function loadData(key){
  const view = VIEWS[key], state = S[key];
  state.loading = true;
  setStatus(key, false, 'Carregando dados…');
  if(key === viewKey) render();

  let rows = [];
  for(const fonte of view.fontes){
    try{
      const parsed = parseResultados(await fetchGviz(view.sheetId, fonte));
      if(parsed.length){ rows = parsed; break; }
    }catch(e){ /* tenta a próxima fonte */ }
  }

  if(rows.length){
    state.rows = rows;
    state.linkMap = await carregarLinks(view);
    const hora = new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date());
    setStatus(key, true, 'Planilha ao vivo · atualizado às ' + hora);
  }else{
    state.rows = view.fallback.map(r => Object.assign({}, r));
    state.linkMap = linksLocais(view.fallbackLinks);
    setStatus(key, false, view.fallbackNote);
  }

  state.loaded = true;
  state.loading = false;
  state.dateFrom = state.dateTo = null;
  if(key === viewKey) render();
}

function setStatus(key, live, text){
  S[key].status = {live:live, text:text};
  if(key !== viewKey) return;
  document.getElementById('status').classList.toggle('live', live);
  document.getElementById('statusText').textContent = text;
}

/* ===================== Período ===================== */
function dataBounds(){
  const ds = st().rows.map(r => r.data).sort();
  return {min: ds[0], max: ds[ds.length-1]};
}

function initDates(){
  const b = dataBounds();
  const from = document.getElementById('dateFrom'), to = document.getElementById('dateTo');
  from.min = to.min = b.min; from.max = to.max = b.max;
  if(!st().dateFrom || !st().dateTo){ st().dateFrom = b.min; st().dateTo = b.max; }
  from.value = st().dateFrom; to.value = st().dateTo;
}

function applyPreset(p){
  const b = dataBounds();
  if(p === 'all'){ st().dateFrom = b.min; st().dateTo = b.max; }
  else{
    const end = new Date(b.max + 'T00:00:00');
    const start = new Date(end); start.setDate(end.getDate() - (parseInt(p,10) - 1));
    st().dateFrom = toISO(start) < b.min ? b.min : toISO(start);
    st().dateTo = b.max;
  }
  document.getElementById('dateFrom').value = st().dateFrom;
  document.getElementById('dateTo').value = st().dateTo;
}

function filtered(){
  const camp = st().campaign;
  return st().rows.filter(r =>
    r.data >= st().dateFrom && r.data <= st().dateTo &&
    (!camp || r.campanha === camp));
}

/* Lista de campanhas distintas presentes nos dados da visão atual. */
function campanhasDisponiveis(){
  const set = new Set();
  for(const r of st().rows) if(r.campanha) set.add(r.campanha);
  return [...set].sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

/* Deixa o nome da campanha mais legível: [A] [B] [C] -> A · B · C */
function nomeCampanha(c){
  const partes = String(c).match(/\[([^\]]+)\]/g);
  if(partes && partes.length) return partes.map(p => p.slice(1, -1).trim()).join(' · ');
  return c;
}

/* ===================== Agregações ===================== */
function capacidades(list){
  const tem = campo => list.some(r => r[campo] != null && r[campo] > 0);
  return {
    impressoes: tem('impressoes'),
    cliques: tem('cliques'),
    visitas: tem('visitas'),
    conjunto: list.some(r => r.conjunto)
  };
}

function totals(list){
  const t = {investido:0, impressoes:0, cliques:0, visitas:0, resultado:0};
  for(const r of list){
    t.investido += r.investido;
    t.impressoes += r.impressoes || 0;
    t.cliques += r.cliques || 0;
    t.visitas += r.visitas || 0;
    t.resultado += r.resultado;
  }
  t.custo = t.resultado ? t.investido/t.resultado : null;
  t.cpc = t.cliques ? t.investido/t.cliques : null;
  t.cpv = t.visitas ? t.investido/t.visitas : null;
  t.ctr = t.impressoes ? t.cliques/t.impressoes*100 : null;
  t.conv = t.visitas ? t.resultado/t.visitas*100 : null;
  return t;
}

function byCreative(list){
  const map = new Map();
  for(const r of list){
    const k = norm(r.anuncio);
    if(!map.has(k)) map.set(k, {key:k, nome:r.anuncio, conjuntos:new Set(), dias:new Set(),
      investido:0, impressoes:0, cliques:0, visitas:0, resultado:0});
    const g = map.get(k);
    if(r.conjunto) g.conjuntos.add(r.conjunto);
    g.dias.add(r.data);
    g.investido += r.investido;
    g.impressoes += r.impressoes || 0;
    g.cliques += r.cliques || 0;
    g.visitas += r.visitas || 0;
    g.resultado += r.resultado;
  }
  const arr = [...map.values()].map(g => Object.assign({}, g, {
    dias: g.dias.size,
    custo: g.resultado ? g.investido/g.resultado : null,
    cpc: g.cliques ? g.investido/g.cliques : null,
    cpv: g.visitas ? g.investido/g.visitas : null,
    ctr: g.impressoes ? g.cliques/g.impressoes*100 : null,
    conv: g.visitas ? g.resultado/g.visitas*100 : null
  }));
  arr.sort((a,b) => b.resultado - a.resultado || (a.custo ?? Infinity) - (b.custo ?? Infinity));
  return arr;
}

function byDay(list){
  const map = new Map();
  for(const r of list){
    if(!map.has(r.data)) map.set(r.data, {data:r.data, resultado:0, investido:0});
    const d = map.get(r.data);
    d.resultado += r.resultado;
    d.investido += r.investido;
  }
  return [...map.values()].sort((a,b) => a.data < b.data ? -1 : 1);
}

/* ===================== Renderização ===================== */
function render(){
  const view = V(), state = st();
  document.getElementById('subtitle').textContent = view.subtitle;
  document.getElementById('rankNote').textContent = view.metric.rankNote;
  document.getElementById('chartNote').textContent = view.metric.chartNote;
  const src = document.getElementById('sourceLink');
  src.textContent = view.sourceLabel;
  src.href = 'https://docs.google.com/spreadsheets/d/' + view.sheetId + '/edit';
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === viewKey));
  document.getElementById('status').classList.toggle('live', state.status.live);
  document.getElementById('statusText').textContent = state.status.text;

  const emptyCard = document.getElementById('emptyCard');
  const content = document.getElementById('content');
  if(!state.rows.length){
    content.classList.add('hidden');
    emptyCard.classList.remove('hidden');
    emptyCard.innerHTML = state.loading
      ? 'Carregando dados da planilha…'
      : 'Não consegui ler a planilha desta campanha. Confira se ela está compartilhada como ' +
        '<b>"Qualquer pessoa com o link → Leitor"</b> e toque em <b>Atualizar agora</b>.';
    if(chart){ chart.destroy(); chart = null; }
    return;
  }
  emptyCard.classList.add('hidden');
  content.classList.remove('hidden');

  renderCampaigns();
  initDates();
  const list = filtered();
  const cap = capacidades(list);
  const criativos = new Set(list.map(r => norm(r.anuncio))).size;
  document.getElementById('campaignCount').textContent =
    criativos ? criativos + (criativos === 1 ? ' criativo' : ' criativos') : '';
  renderKpis(list, cap);
  renderRanking(list, cap);
  renderChart(list);
  renderTable(list, cap);
}

/* Preenche o seletor com as campanhas da visão atual. Some quando há 0-1. */
function renderCampaigns(){
  const bar = document.getElementById('campaignBar');
  const sel = document.getElementById('campaignFilter');
  const campanhas = campanhasDisponiveis();
  if(st().campaign && !campanhas.includes(st().campaign)) st().campaign = '';
  if(campanhas.length <= 1){ bar.classList.add('hidden'); sel.innerHTML = ''; return; }
  bar.classList.remove('hidden');
  sel.innerHTML =
    '<option value="">Todas as campanhas (' + campanhas.length + ')</option>' +
    campanhas.map(c =>
      '<option value="' + esc(c) + '"' + (c === st().campaign ? ' selected' : '') + '>' +
      esc(nomeCampanha(c)) + '</option>').join('');
  sel.value = st().campaign;
}

function renderKpis(list, cap){
  const m = V().metric, t = totals(list);
  const cards = [
    {label:'Investimento', value:fmtBRL(t.investido)},
    {label:m.kpi, value:fmtNum(t.resultado), hero:true},
    {label:m.cost, value:fmtBRL(t.custo), hero:true}
  ];
  if(cap.visitas){
    cards.push({label:'Visitas ao perfil', value:fmtNum(t.visitas)});
    cards.push({label:'Custo por visita', value:fmtBRL(t.cpv)});
    cards.push({label:'Visita → seguidor', value:fmtPct(t.conv)});
  }
  if(cap.cliques){
    cards.push({label:'Cliques no link', value:fmtNum(t.cliques)});
    cards.push({label:'CPC', value:fmtBRL(t.cpc)});
  }
  if(cap.impressoes && cap.cliques) cards.push({label:'CTR', value:fmtPct2(t.ctr)});
  if(cap.impressoes) cards.push({label:'Impressões', value:fmtNum(t.impressoes)});
  cards.push({label:'Dias no período', value:String(new Set(list.map(r => r.data)).size)});

  document.getElementById('kpis').innerHTML = cards.map(c =>
    '<div class="kpi' + (c.hero ? ' hero' : '') + '">' +
      '<div class="label">' + c.label + '</div>' +
      '<div class="value">' + c.value + '</div>' +
    '</div>').join('');
}

function nomeComLink(key, nome){
  const url = st().linkMap[key];
  return url
    ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(nome) + ' \u2197</a>'
    : esc(nome);
}

function renderRanking(list, cap){
  const m = V().metric;
  const el = document.getElementById('ranking');
  const groups = byCreative(list);
  if(!groups.length){ el.innerHTML = '<p class="empty">Sem dados no período selecionado.</p>'; return; }
  const max = Math.max.apply(null, groups.map(g => g.resultado).concat([1]));

  el.innerHTML = groups.map((g,i) => {
    const conj = [...g.conjuntos].map(c => '<span class="tag">' + esc(c) + '</span>').join('');
    const leader = i === 0 && g.resultado > 0 ? '<span class="tag leader">Líder do período</span>' : '';
    const pct = Math.round(g.resultado / max * 100);
    let extra = '';
    if(cap.visitas) extra = '<span>Visitas <b>' + fmtNum(g.visitas) + '</b></span>' +
                            '<span>Visita → seguidor <b>' + fmtPct(g.conv) + '</b></span>';
    else if(cap.cliques) extra = '<span>Cliques <b>' + fmtNum(g.cliques) + '</b></span>' +
                                 (cap.impressoes ? '<span>CTR <b>' + fmtPct2(g.ctr) + '</b></span>' : '');
    else if(cap.impressoes) extra = '<span>Impressões <b>' + fmtNum(g.impressoes) + '</b></span>';
    return '<div class="rank-item">' +
      '<div class="rank-head"><span class="rank-name">' + nomeComLink(g.key, g.nome) + '</span>' + conj + leader + '</div>' +
      '<div class="rank-bar-row">' +
        '<div class="rank-track"><div class="rank-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="rank-count">' + fmtNum(g.resultado) + '<small>' + m.unit + '</small></div>' +
      '</div>' +
      '<div class="rank-meta">' +
        '<span class="chip">' + m.chip + ' ' + fmtBRL(g.custo) + '</span>' +
        '<span>Investido <b>' + fmtBRL(g.investido) + '</b></span>' + extra +
      '</div>' +
    '</div>';
  }).join('');
}

function renderChart(list){
  if(typeof Chart === 'undefined'){
    document.querySelector('.chart-box').innerHTML =
      '<p class="empty">Gráfico indisponível sem conexão com a biblioteca de gráficos.</p>';
    return;
  }
  const m = V().metric, days = byDay(list);
  if(chart) chart.destroy();
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink').trim();
  const muted = css.getPropertyValue('--muted').trim();
  const line = css.getPropertyValue('--line').trim();

  chart = new Chart(document.getElementById('dailyChart'), {
    data:{
      labels: days.map(d => fmtDayShort(d.data)),
      datasets:[
        {type:'bar', label:m.axis, data:days.map(d => d.resultado), yAxisID:'y',
         backgroundColor:'rgba(169,128,63,.85)', hoverBackgroundColor:'#7E5F2E',
         borderRadius:6, maxBarThickness:52},
        {type:'line', label:'Investimento (R$)', data:days.map(d => +d.investido.toFixed(2)), yAxisID:'y2',
         borderColor:ink, borderWidth:1.5, pointRadius:days.length > 40 ? 0 : 3,
         pointBackgroundColor:ink, tension:.3}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{labels:{color:muted, font:{family:'Archivo', size:12}, boxWidth:14, boxHeight:14}},
        tooltip:{
          backgroundColor:'#2C211A', titleFont:{family:'Archivo'}, bodyFont:{family:'Archivo'},
          callbacks:{ label: ctx => ctx.dataset.yAxisID === 'y2'
            ? ' Investimento: ' + fmtBRL(ctx.parsed.y)
            : ' ' + m.axis + ': ' + fmtNum(ctx.parsed.y) }
        }
      },
      scales:{
        x:{grid:{display:false}, ticks:{color:muted, font:{family:'Archivo', size:12}, maxRotation:0, autoSkipPadding:12}},
        y:{beginAtZero:true, ticks:{color:muted, precision:0, font:{family:'Archivo', size:12}},
           grid:{color:line}, title:{display:true, text:m.axis, color:muted, font:{family:'Archivo', size:11}}},
        y2:{beginAtZero:true, position:'right', grid:{drawOnChartArea:false},
            ticks:{color:muted, font:{family:'Archivo', size:12}, callback: v => 'R$ ' + v},
            title:{display:true, text:'Investimento', color:muted, font:{family:'Archivo', size:11}}}
      }
    }
  });
}

function buildCols(cap){
  const m = V().metric;
  const cols = [{key:'anuncio', label:'Anúncio', left:true, fmt: r => nomeComLink(r.key, r.anuncio)}];
  if(cap.conjunto) cols.push({key:'conjunto', label:'Conjunto', left:true, fmt: r => esc(r.conjunto)});
  cols.push({key:'dias', label:'Dias', fmt: r => fmtNum(r.dias)});
  cols.push({key:'investido', label:'Investido', fmt: r => fmtBRL(r.investido)});
  if(cap.impressoes) cols.push({key:'impressoes', label:'Impressões', fmt: r => fmtNum(r.impressoes)});
  if(cap.visitas){
    cols.push({key:'visitas', label:'Visitas', fmt: r => fmtNum(r.visitas)});
    cols.push({key:'cpv', label:'Custo/visita', fmt: r => fmtBRL(r.cpv)});
  }
  if(cap.cliques){
    cols.push({key:'cliques', label:'Cliques', fmt: r => fmtNum(r.cliques)});
    cols.push({key:'cpc', label:'CPC', fmt: r => fmtBRL(r.cpc)});
  }
  if(cap.impressoes && cap.cliques) cols.push({key:'ctr', label:'CTR', fmt: r => fmtPct2(r.ctr)});
  cols.push({key:'resultado', label:m.axis, fmt: r => '<span class="strong">' + fmtNum(r.resultado) + '</span>'});
  cols.push({key:'custo', label:m.chip, fmt: r => r.custo == null ? '<span class="muted">—</span>' : fmtBRL(r.custo)});
  if(cap.visitas) cols.push({key:'conv', label:'Visita → seg.', fmt: r => fmtPct(r.conv)});
  return cols;
}

function renderTable(list, cap){
  const cols = buildCols(cap);
  const rowsT = byCreative(list).map(g => Object.assign({}, g, {conjunto: [...g.conjuntos].join(' · ')}));
  const state = st();
  if(!cols.some(c => c.key === state.sortKey)){ state.sortKey = 'resultado'; state.sortDir = 'desc'; }

  const thead = document.getElementById('theadRow');
  thead.innerHTML = cols.map(c => {
    const ativo = state.sortKey === c.key;
    const arrow = ativo ? '<span class="arrow"> ' + (state.sortDir === 'asc' ? '\u2191' : '\u2193') + '</span>' : '';
    const aria = ativo ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none';
    return '<th data-key="' + c.key + '" class="' + (c.left ? 'left' : '') + '" aria-sort="' + aria + '">' + c.label + arrow + '</th>';
  }).join('');
  thead.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.key;
      if(state.sortKey === k) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = k; state.sortDir = (k === 'anuncio' || k === 'conjunto') ? 'asc' : 'desc'; }
      renderTable(filtered(), cap);
    });
  });

  const sorted = rowsT.slice().sort((a,b) => {
    let va = a[state.sortKey], vb = b[state.sortKey];
    if(va == null) return 1;
    if(vb == null) return -1;
    if(typeof va === 'string'){ va = va.toLowerCase(); vb = String(vb).toLowerCase(); }
    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return state.sortDir === 'asc' ? cmp : -cmp;
  });

  document.getElementById('tbody').innerHTML = sorted.length
    ? sorted.map(r => '<tr>' + cols.map(c => '<td class="' + (c.left ? 'left' : '') + '">' + c.fmt(r) + '</td>').join('') + '</tr>').join('')
    : '<tr><td colspan="' + cols.length + '" class="left muted">Sem dados no período selecionado.</td></tr>';
}

/* ===================== Eventos ===================== */
document.getElementById('viewNav').addEventListener('click', e => {
  const btn = e.target.closest('.view-btn');
  if(!btn || btn.dataset.view === viewKey) return;
  viewKey = btn.dataset.view;
  history.replaceState(null, '', '#' + viewKey);
  st().dateFrom = st().dateTo = null;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  document.querySelector('.pill[data-preset="all"]').classList.add('active');
  render();
  if(!st().loaded) loadData(viewKey);
});

document.getElementById('campaignFilter').addEventListener('change', e => {
  st().campaign = e.target.value || '';
  render();
});

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.pill');
  if(!btn) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  applyPreset(btn.dataset.preset);
  render();
});

document.getElementById('dateFrom').addEventListener('change', e => {
  st().dateFrom = e.target.value || st().dateFrom;
  if(st().dateFrom > st().dateTo){ st().dateTo = st().dateFrom; document.getElementById('dateTo').value = st().dateTo; }
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  render();
});

document.getElementById('dateTo').addEventListener('change', e => {
  st().dateTo = e.target.value || st().dateTo;
  if(st().dateTo < st().dateFrom){ st().dateFrom = st().dateTo; document.getElementById('dateFrom').value = st().dateFrom; }
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  render();
});

document.getElementById('refreshBtn').addEventListener('click', () => loadData(viewKey));

loadData(viewKey);
loadData(viewKey === 'leads' ? 'seguidores' : 'leads');
</script>
